<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a1a1aa"/>
    </marker>
    <style>
      .lbl{fill:#a1a1aa;font-size:12px}
      .txt{fill:#fafafa;font-size:14px;font-weight:600}
      .sub{fill:#a1a1aa;font-size:11px}
      .edge{stroke:#a1a1aa;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1100" height="900" fill="#09090b"/>
  <text x="40" y="46" fill="#fafafa" font-size="24" font-weight="700">Flujo de proceso — Administración de Proveedores (HU1)</text>
  <text x="40" y="70" class="lbl">CRUD vía GraphQL · validaciones · control de duplicados · soft delete</text>

  <!-- START -->
  <rect x="450" y="100" width="200" height="46" rx="23" fill="#3b82f6"/>
  <text x="550" y="128" text-anchor="middle" class="txt" fill="#0b1220">Listado de Proveedores</text>

  <!-- decision: acción -->
  <path d="M550 160 L650 215 L550 270 L450 215 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="212" text-anchor="middle" class="txt">¿Acción?</text>
  <text x="550" y="230" text-anchor="middle" class="sub">Crear / Editar / Desactivar</text>
  <line x1="550" y1="146" x2="550" y2="160" class="edge"/>

  <!-- branch labels -->
  <text x="250" y="300" class="lbl">CREAR</text>
  <text x="545" y="300" class="lbl">EDITAR</text>
  <text x="830" y="300" class="lbl">DESACTIVAR</text>

  <!-- CREATE column -->
  <rect x="150" y="320" width="220" height="52" rx="10" fill="#27272a" stroke="#3f3f46"/>
  <text x="260" y="345" text-anchor="middle" class="txt">Formulario vacío</text>
  <text x="260" y="362" text-anchor="middle" class="sub">crearProveedor(input)</text>

  <!-- EDIT column -->
  <rect x="440" y="320" width="220" height="52" rx="10" fill="#27272a" stroke="#3f3f46"/>
  <text x="550" y="345" text-anchor="middle" class="txt">Formulario precargado</text>
  <text x="550" y="362" text-anchor="middle" class="sub">obtenerProveedor(id)</text>

  <!-- DESACTIVAR column -->
  <rect x="730" y="320" width="220" height="52" rx="10" fill="#27272a" stroke="#3f3f46"/>
  <text x="840" y="345" text-anchor="middle" class="txt">Confirmar desactivación</text>
  <text x="840" y="362" text-anchor="middle" class="sub">¿Está seguro?</text>

  <path d="M470 215 L260 215 L260 320" class="edge"/>
  <path d="M550 270 L550 320" class="edge"/>
  <path d="M630 215 L840 215 L840 320" class="edge"/>

  <!-- VALIDATION decision (shared crear/editar) -->
  <path d="M405 430 L520 485 L405 540 L290 485 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="405" y="482" text-anchor="middle" class="txt">¿Datos válidos?</text>
  <text x="405" y="500" text-anchor="middle" class="sub">CA1: cédula, nombre, tel, email…</text>
  <path d="M260 372 L260 485 L290 485" class="edge"/>
  <path d="M550 372 L550 485 L520 485" class="edge"/>

  <!-- error -->
  <rect x="40" y="460" width="190" height="50" rx="10" fill="#3f1d1d" stroke="#ef4444"/>
  <text x="135" y="482" text-anchor="middle" class="txt" fill="#fecaca">Mostrar error(es)</text>
  <text x="135" y="499" text-anchor="middle" class="sub" fill="#fca5a5">y permitir corregir</text>
  <path d="M290 485 L230 485" class="edge"/>
  <text x="248" y="478" class="lbl">No</text>
  <!-- loop back -->
  <path d="M135 460 L135 346 L150 346" class="edge"/>

  <!-- duplicate decision -->
  <path d="M405 585 L520 640 L405 695 L290 640 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="405" y="637" text-anchor="middle" class="txt">¿Cédula/RUC</text>
  <text x="405" y="655" text-anchor="middle" class="txt">duplicada?</text>
  <path d="M405 540 L405 585" class="edge"/>
  <text x="415" y="568" class="lbl">Sí</text>

  <rect x="40" y="615" width="190" height="50" rx="10" fill="#3f1d1d" stroke="#ef4444"/>
  <text x="135" y="637" text-anchor="middle" class="txt" fill="#fecaca">Error: "Ya existe"</text>
  <text x="135" y="654" text-anchor="middle" class="sub" fill="#fca5a5">CA2 · cancelar o corregir</text>
  <path d="M290 640 L230 640" class="edge"/>
  <text x="248" y="633" class="lbl">Sí</text>

  <!-- SAVE -->
  <rect x="310" y="740" width="200" height="52" rx="10" fill="#27272a" stroke="#22c55e"/>
  <text x="410" y="765" text-anchor="middle" class="txt" fill="#86efac">Guardar en BD</text>
  <text x="410" y="782" text-anchor="middle" class="sub">create / update (Prisma)</text>
  <path d="M405 695 L405 740" class="edge"/>
  <text x="415" y="722" class="lbl">No</text>

  <!-- SOFT DELETE -->
  <rect x="730" y="430" width="220" height="64" rx="10" fill="#27272a" stroke="#f59e0b"/>
  <text x="840" y="455" text-anchor="middle" class="txt" fill="#fcd34d">Soft Delete</text>
  <text x="840" y="473" text-anchor="middle" class="sub">estado = INACTIVO</text>
  <text x="840" y="488" text-anchor="middle" class="sub">deletedAt = now()  (CA3)</text>
  <path d="M840 372 L840 430" class="edge"/>

  <!-- SUCCESS -->
  <rect x="600" y="810" width="320" height="50" rx="25" fill="#22c55e"/>
  <text x="760" y="841" text-anchor="middle" class="txt" fill="#06210f">Mensaje "Guardado con éxito" → Listado</text>
  <path d="M510 766 L760 766 L760 810" class="edge"/>
  <path d="M840 494 L840 700 L760 700 L760 810" class="edge"/>

  <text x="40" y="888" class="sub">Leyenda:  ▭ proceso   ◇ decisión   ▭(rojo) error   ▭(verde) éxito   ▭(ámbar) soft delete</text>
</svg>
